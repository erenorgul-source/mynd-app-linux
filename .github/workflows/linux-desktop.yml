name: Linux desktop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm dbus

      - name: Run desktop tests
        run: ./gradlew --console=plain -Popenmynd.android=false :composeApp:desktopTest

      - name: Build jar, .deb and .rpm
        run: >
          ./gradlew --console=plain -Popenmynd.android=false
          :composeApp:packageUberJarForCurrentOS :composeApp:packageDeb :composeApp:packageRpm

      - uses: actions/upload-artifact@v4
        with:
          name: openmynd-linux-x64
          path: |
            composeApp/build/compose/jars/*.jar
            composeApp/build/compose/binaries/main/deb/*.deb
            composeApp/build/compose/binaries/main/rpm/*.rpm

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: composeApp/build/reports/tests/

  aur:
    name: Arch Linux package (AUR PKGBUILD)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install git
        run: pacman -Syu --noconfirm git desktop-file-utils appstream

      - uses: actions/checkout@v4

      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate packaging/linux/de.teufel.openmynd.desktop
          appstreamcli validate --no-net --explain packaging/linux/de.teufel.openmynd.metainfo.xml

      - name: makepkg
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          cp -r packaging/aur/openmynd-git /tmp/aur
          # Build the pushed commit instead of the default branch on GitHub.
          sed -i "s|^source=.*|source=(\"\$_pkgname::git+file://$GITHUB_WORKSPACE#commit=$GITHUB_SHA\")|" /tmp/aur/PKGBUILD
          chown -R builder /tmp/aur
          sudo -u builder git config --global --add safe.directory '*'
          sudo -u builder bash -c 'cd /tmp/aur && makepkg --syncdeps --noconfirm'
          pacman -Qlp /tmp/aur/*.pkg.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: openmynd-git-arch
          path: /tmp/aur/*.pkg.tar.zst
