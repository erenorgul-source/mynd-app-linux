[versions]

buffer = "1.4.2"
koinAndroid = "4.1.0"
kotlin = "2.2.0"
compose-icons = "1.7.3"
compose = "1.8.2"
agp = "8.12.0"
androidx-activityCompose = "1.10.1"
androidx-uiTest = "1.9.0"
androidx-lifecycle = "2.9.1"
kotlinReflect = "2.1.21"
kotlinxDatetime = "0.7.1"
permissions = "0.19.1"
statelyConcurrentCollections = "2.1.0"
uuid = "0.8.4"
voyager = "1.1.0-beta03"
coil = "3.3.0"
kotlinx-coroutines = "1.10.2"
kotlinx-serialization = "1.9.0"
koin = "4.1.0"
lottie = "1.1.2"
blue-falcon = "2.3.0"
kermit = "2.0.6"
multiplatformSettings = "1.3.0"
kable = "0.32.0"
dbus-java = "5.2.2"
slf4j = "2.0.17"

[libraries]

androidx-activityCompose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-testManifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidx-uiTest" }
androidx-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "androidx-uiTest" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
buffer = { module = "com.ditchoom:buffer", version.ref = "buffer" }
icons = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "compose-icons" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koinAndroid" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlinReflect" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
permissions = { module = "dev.icerock.moko:permissions", version.ref = "permissions" }
permissions-bluetooth = { module = "dev.icerock.moko:permissions-bluetooth", version.ref = "permissions" }
permissions-compose = { module = "dev.icerock.moko:permissions-compose", version.ref = "permissions" }
permissions-location = { module = "dev.icerock.moko:permissions-location", version.ref = "permissions" }
stately-concurrent-collections = { module = "co.touchlab:stately-concurrent-collections", version.ref = "statelyConcurrentCollections" }
uuid = { module = "com.benasher44:uuid", version.ref = "uuid" }
voyager-navigation = { module = "cafe.adriel.voyager:voyager-navigator", version.ref = "voyager" }
voyager-navigation-tabs = { module = "cafe.adriel.voyager:voyager-tab-navigator", version.ref = "voyager" }

lottie = { group = "io.github.alexzhirkevich", name = "compottie", version.ref = "lottie" }
coil = { module = "io.coil-kt.coil3:coil-compose-core", version.ref = "coil" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
#koin-compose-ios = { module = "io.insert-koin:koin-compose-iosarm64", version = "koin-compose" }

kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
multiplatform-settings = { module = "com.russhwolf:multiplatform-settings", version.ref = "multiplatformSettings" }
multiplatform-settings-serialization = { module = "com.russhwolf:multiplatform-settings-serialization", version.ref = "multiplatformSettings" }
blue-falcon = { module = "dev.bluefalcon:blue-falcon", version.ref = "blue-falcon" }
kable-core = { module = "com.juul.kable:core", version.ref = "kable" }
dbus-java-core = { module = "com.github.hypfvieh:dbus-java-core", version.ref = "dbus-java" }
dbus-java-transport-native-unixsocket = { module = "com.github.hypfvieh:dbus-java-transport-native-unixsocket", version.ref = "dbus-java" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }

[plugins]

multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
